[workspace]
resolver = "2"
members = ["crates/ir-core", "crates/ir-ui", "crates/ir-app"]

[workspace.package]
version = "0.10.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/MasqueRole/MasqueRole"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
eframe = "0.31"
egui = "0.31"
anyhow = "1"
