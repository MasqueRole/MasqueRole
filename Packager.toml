# Installer settings for cargo-packager. Build first, then run:
#   cargo build --release -p masquerole-app
#   cargo packager --release --formats nsis        # Windows
#   cargo packager --release --formats deb,appimage # Linux
# cargo-packager silently ignores a root-level config without a package name.
name = "masquerole"
product-name = "MasqueRole"
identifier = "io.github.masquerole.masquerole"
version = "0.16.1"
description = "Endless, consistent roleplay with the AI model of your choice."
authors = ["MasqueRole"]
license-file = "LICENSE"
icons = ["assets/icon.ico", "assets/icon.png"]
out-dir = "dist"
binaries-dir = "target/release"
binaries = [{ path = "masquerole", main = true }]
